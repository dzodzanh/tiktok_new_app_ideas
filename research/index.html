<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nghiên cứu TikTok</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: một cột, danh sách báo cáo mới nhất ở trên */
:root{--bg:#f6f5f8;--surface:#fff;--fg:#1d1a24;--muted:#6b6576;--line:#e3dfe8;--accent:#b8325a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16141b;--surface:#1f1c26;--fg:#ece8f2;--muted:#a49db0;--line:#332e3d;--accent:#ec6f94;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
h1{font:700 clamp(28px,5vw,40px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
p.sub{color:var(--muted);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.card{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.date{font:500 12px "IBM Plex Mono",monospace;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.card b{font-size:17px}.card span:last-child{color:var(--muted);font-size:14px}
.home{font-size:13px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="../">← Hàng chờ đăng</a>
<h1>Nghiên cứu TikTok</h1>
<p class="sub">Báo cáo đối thủ và format viral cho các app trong danh mục. Báo cáo mới nhất ở trên cùng.</p>
<ul>
<li><a class="card" href="no-contact-2026-10-25/"><span class="date">25.10.2026 · Better off</span><b>Đối thủ no contact có chạy app, tuần 17–24.10</b><span>27 account (Closure, No Contact App, Zero Contact), 209 bài, 7 format viral kèm hook mẫu.</span></a></li>
</ul>
</div>
</body>
</html>
